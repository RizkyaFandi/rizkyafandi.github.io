<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Fandi Portfolio</title>
  
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Google Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
  </style>
</head>
<body class="bg-white text-slate-800 flex flex-col min-h-screen antialiased selection:bg-slate-800 selection:text-white">

  <!-- Shared Header Injection Container -->
  <div id="navbar"></div>

  <!-- Main Content Area -->
  <main id="main-content" class="flex-grow">
    <!-- Contact / Connect Section -->
    <section class="relative w-full bg-[#121622] py-16 lg:py-24 overflow-hidden" id="contact">
      <!-- Background Image Layer (Ready for swap via img src or CSS background-image) -->
      <div class="absolute inset-0 w-full h-full pointer-events-none opacity-20">
        <!-- Optional background image can be placed here: <img src="..." alt="Background" class="w-full h-full object-cover" /> -->
      </div>

      <!-- Container: matches design system spec px-6 sm:px-12 lg:px-[64px] -->
      <div class="relative z-10 w-full max-w-7xl mx-auto px-6 sm:px-12 lg:px-[64px]">
        <!-- Two-column grid on desktop, stacking vertically on mobile/tablet -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-16 items-center">

          <!-- Left Side - Featured Image Container (#965F5F) (5 Columns / approx 40-45% width) -->
          <div class="lg:col-span-5 w-full">
            <div class="w-full aspect-square rounded-3xl bg-[#965F5F] overflow-hidden flex items-center justify-center relative shadow-2xl">
              <!-- Empty placeholder ready to accept any image URL via src attribute -->
              <img 
                src="" 
                alt="Connect with Farhan Rizkyafandi" 
                class="w-full h-full object-cover hidden" 
                onerror="this.classList.add('hidden')"
              />
              <div class="text-white/60 flex flex-col items-center gap-2 p-6 text-center select-none">
                <span class="material-symbols-outlined text-5xl">contact_mail</span>
                <span class="text-xs uppercase tracking-wider font-semibold">Image Placeholder</span>
              </div>
            </div>
          </div>

          <!-- Right Column - Contact Info & Links (7 Columns / approx 55-60% width) -->
          <div class="lg:col-span-7 flex flex-col justify-center">
            <!-- 1. Gradient Accent Bar -->
            <div class="w-20 h-2 bg-gradient-to-r from-amber-400 to-rose-500 rounded-full mb-4"></div>

            <!-- 2. Section Title (H2) -->
            <h2 class="text-3xl md:text-4xl lg:text-5xl font-black text-white tracking-tight mb-8">
              Let's connect with me!
            </h2>

            <!-- 3. Contact Links List -->
            <ul class="space-y-4 text-slate-300 font-medium text-sm md:text-base">
              
              <!-- Item 1 (Phone/WhatsApp) -->
              <li>
                <a 
                  href="https://wa.me/6281249417220" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  class="inline-flex items-center gap-3.5 hover:text-white hover:translate-x-1 transition-all duration-200 cursor-pointer"
                >
                  <div class="w-6 h-6 flex items-center justify-center text-amber-400 flex-shrink-0">
                    <span class="material-symbols-outlined text-xl select-none">chat</span>
                  </div>
                  <span>(+62) 81249417220</span>
                </a>
              </li>

              <!-- Item 2 (Email) -->
              <li>
                <a 
                  href="mailto:farhanrizkyafandi@gmail.com" 
                  class="inline-flex items-center gap-3.5 hover:text-white hover:translate-x-1 transition-all duration-200 cursor-pointer"
                >
                  <div class="w-6 h-6 flex items-center justify-center text-amber-400 flex-shrink-0">
                    <span class="material-symbols-outlined text-xl select-none">mail</span>
                  </div>
                  <span>farhanrizkyafandi@gmail.com</span>
                </a>
              </li>

              <!-- Item 3 (LinkedIn) -->
              <li>
                <a 
                  href="https://linkedin.com/in/farhanrizkyafandi" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  class="inline-flex items-center gap-3.5 hover:text-white hover:translate-x-1 transition-all duration-200 cursor-pointer"
                >
                  <div class="w-6 h-6 flex items-center justify-center text-amber-400 flex-shrink-0">
                    <span class="material-symbols-outlined text-xl select-none">badge</span>
                  </div>
                  <span>Farhan Rizkyafandi</span>
                </a>
              </li>

              <!-- Item 4 (Portfolio Link) -->
              <li>
                <a 
                  href="https://tinyurl.com/fandiportfolio" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  class="inline-flex items-center gap-3.5 hover:text-white hover:translate-x-1 transition-all duration-200 cursor-pointer"
                >
                  <div class="w-6 h-6 flex items-center justify-center text-amber-400 flex-shrink-0">
                    <span class="material-symbols-outlined text-xl select-none">link</span>
                  </div>
                  <span>tinyurl.com/fandiportfolio</span>
                </a>
              </li>

              <!-- Item 5 (Dribbble) -->
              <li>
                <a 
                  href="https://dribbble.com/FRFandi" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  class="inline-flex items-center gap-3.5 hover:text-white hover:translate-x-1 transition-all duration-200 cursor-pointer"
                >
                  <div class="w-6 h-6 flex items-center justify-center text-amber-400 flex-shrink-0">
                    <span class="material-symbols-outlined text-xl select-none">arrow_outward</span>
                  </div>
                  <span>dribbble.com/FRFandi</span>
                </a>
              </li>

            </ul>
          </div>

        </div>
      </div>
    </section>
  </main>

  <!-- Shared Footer Injection Container -->
  <div id="footer"></div>

  <!-- Centralized Modular Components Script -->
  <script src="components.js"></script>
</body>
</html>
