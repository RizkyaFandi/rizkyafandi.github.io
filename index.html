<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - Home</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">

  <!-- Google Material Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
  </style>
</head>

<body
  class="bg-white text-slate-800 dark:bg-slate-950 dark:text-slate-100 flex flex-col min-h-screen antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Shared Header Injection Container -->
  <div id="navbar"></div>

  <!-- Main Content Area -->
  <main id="main-content" class="flex-grow">
    <!-- Ready state placeholder for upcoming sections -->
    <section
      class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-12 py-20 lg:py-32 flex flex-col items-center justify-center text-center">
      <div
        class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 text-xs font-semibold tracking-wide mb-6 border border-indigo-100 dark:border-indigo-900/50">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Project Environment Ready
      </div>
      <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold tracking-tight text-slate-900 dark:text-white max-w-2xl">
        Ready for First Section
      </h1>
      <p class="mt-4 text-slate-600 dark:text-slate-400 max-w-lg text-sm sm:text-base leading-relaxed">
        The base architecture, Tailwind CSS configuration, Poppins typography, Material Symbols, and modular component
        injection are set up and active.
      </p>
    </section>
  </main>

  <!-- Shared Footer Injection Container -->
  <div id="footer"></div>

  <!-- Centralized Modular Components Script -->
  <script src="components.js"></script>
</body>

</html>
